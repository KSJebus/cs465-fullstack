<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Admin Login</h1>

    <form (ngSubmit)="onLoginSubmit()">
      @if (formError) {
        <div class="alert alert-danger" role="alert">{{ formError }}</div>
      }
      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" autocomplete="username"
               placeholder="Enter email address" [(ngModel)]="credentials.email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               autocomplete="current-password" placeholder="Password" [(ngModel)]="credentials.password">
      </div>
      <button type="submit" class="btn btn-info w-100" [disabled]="submitted">Sign In!</button>
    </form>
  </div>
</div>
